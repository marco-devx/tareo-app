<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte · Tareo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>⏱️</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-pagina="reporte">
  <header class="topbar"><div class="marca">⏱️ Tareo de horas</div><span class="chip">Administración</span></header>
  <main class="contenedor">
    <div id="app" hidden>
      <nav class="tabs no-imprimir" aria-label="Administración">
        <a href="/personas" data-pagina-link="personas">Personas</a>
        <a href="/clientes" data-pagina-link="clientes">Clientes</a>
        <a href="/reporte" data-pagina-link="reporte">Reporte</a>
        <a href="/" class="volver">← Ir al tareo</a>
      </nav>
      <div class="tarjeta no-imprimir">
        <div class="cabecera-tarjeta"><h2>Reporte de horas</h2></div>
        <form id="form-reporte" class="filtros">
          <label>Desde <input type="date" id="r-desde"></label>
          <label>Hasta <input type="date" id="r-hasta"></label>
          <div class="rapidos">
            <button type="button" class="btn chico" data-rango="mes">Este mes</button>
            <button type="button" class="btn chico" data-rango="mes-anterior">Mes anterior</button>
            <button type="button" class="btn chico" data-rango="semana">Últimos 7 días</button>
            <button type="button" class="btn chico" data-rango="todo">Todo</button>
          </div>
          <button class="btn primario">Generar reporte</button>
        </form>
        <div class="fila exportar">
          <button type="button" class="btn" id="btn-csv-detalle">⬇ CSV detalle</button>
          <button type="button" class="btn" id="btn-csv-resumen">⬇ CSV resumen</button>
          <button type="button" class="btn" id="btn-json">⬇ Respaldo JSON</button>
          <button type="button" class="btn" id="btn-imprimir">🖨 Imprimir</button>
        </div>
      </div>
      <div id="reporte"></div>
    </div>
  </main>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
